name: Testy

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: pytest
      - run: node --test tests/js/*.test.js
      - run: ruff check app/
      - run: mypy app/
      - run: pyright app/ tests/
