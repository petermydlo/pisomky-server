name: Testy

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: pip install -r requirements.txt
      - run: pytest
      - run: node --test tests/js/*.test.js
      - run: ruff check app/
      - run: mypy app/
      - run: pyright app/ tests/
